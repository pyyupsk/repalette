<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Repalette — Extract & remap image palettes</title>
    <meta
      name="description"
      content="Extract every color from any image. Remap with preset palettes or per-swatch swaps. Export recolored PNG and palette JSON/CSS."
    />
    <link rel="canonical" href="https://repalette.fasu.dev/" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fbf6f8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1a1416"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Repalette" />
    <meta property="og:url" content="https://repalette.fasu.dev/" />
    <meta
      property="og:title"
      content="Repalette — Extract & remap image palettes"
    />
    <meta
      property="og:description"
      content="Extract every color from any image. Remap with preset palettes or per-swatch swaps. Export recolored PNG and palette JSON/CSS."
    />
    <meta
      property="og:image"
      content="https://repalette.fasu.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Repalette — Extract & remap image palettes"
    />
    <meta
      name="twitter:description"
      content="Extract every color from any image. Remap with preset palettes or per-swatch swaps."
    />
    <meta
      name="twitter:image"
      content="https://repalette.fasu.dev/og-image.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Repalette",
        "url": "https://repalette.fasu.dev/",
        "description": "Extract every color from any image. Remap with preset palettes or per-swatch swaps. Export recolored PNG and palette JSON/CSS.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var sys = matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || (t !== "light" && sys);
          var el = document.documentElement;
          el.style.colorScheme = dark ? "dark" : "light";
          el.style.background = dark
            ? "oklch(15% 0.006 350)"
            : "oklch(98% 0.004 350)";
          if (t === "light" || t === "dark") el.setAttribute("data-theme", t);
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <noscript>
        <h1>Repalette</h1>
        <p>
          Extract every distinct color from an image, inspect pixel counts and
          frequencies, and remap colors — one-by-one or via preset palettes —
          with shade-preserving algorithms. Export recolored PNG and palette
          JSON/CSS.
        </p>
        <p>
          Repalette is a client-side tool. JavaScript is required to upload an
          image and run the palette extractor.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
